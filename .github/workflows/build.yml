name: Build

on:
  push:
    branches:
      - '**'
    paths-ignore:
      - '**.md'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: true
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Prepare a docker container for build
        uses: docker/build-push-action@v7
        with:
          context: tools/docker
          file: tools/docker/slim.dockerfile
          load: true
          tags: spike-rt:slim
          push: false
          cache-from: type=gha,scope=slim
          cache-to: type=gha,mode=max,scope=slim
      - name: Build default application
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/work" \
            -w /work \
            spike-rt:slim \
            bash -c '
              set -euo pipefail
              export PATH="/usr/local/gcc-arm-none-eabi/bin:${PATH}"
              git config --global --add safe.directory "*"
              arm-none-eabi-g++ --version
              make setup
              make
            '
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: etrobo_nao
          if-no-files-found: error
          path: |
            sdk/workspace/asp.bin
            sdk/workspace/etrobo_nao/build/asp
            sdk/workspace/etrobo_nao/build/asp.bin
            sdk/workspace/etrobo_nao/build/asp.syms
